<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>밍고 발전소 · Flamingo Stadium</title><link rel="stylesheet" href="../common/style.css"></head>
<body><div class="wrap"><canvas id="game"></canvas><div class="bar"><a href="../index.html">← 스타디움</a><span>조작: 튀어나온 전극 쪽으로 ←→↑↓ · 파랑이면 A 연타 · 초록이면 B 연타</span></div></div>
<script src="../common/stadium.js"></script>
<script>
const { palette, drawFlamingo, drawPlayerTag, Game, sfx, text, rr, rand, clamp, slots } = STADIUM;
// ---- 튜닝 상수 (specs/pichu.md §3~§8) ----
const W = 960, H = 540, FULL = 100, CAP = 0.066, HOLDS = [1, 1.5, 2], GAP = 0.2, LIGHT_AT = 0.3, SAFETY = 60, E = 84;
const GAIN = { human: 2.0, cpu: 1.6 }; // 정답 1회 충전량(%). 오색은 2회분 감소. 스펙 기본 1.25(80회)는 전환 공백·관성 페널티를 넣으면 Normal CPU가 30초 넘게 걸려 §2차-5 목표 시간에 맞춰 상향, 사람은 키보드 연타 보정(§2차-5 허용)
const TIERS = { normal: { d: [.26, .36], c: [.07, .13], rate: [9, 10], pErr: .25, errK: 2, pWrong: .12 }, hard: { d: [.17, .25], c: [.04, .08], rate: [9.5, 10.5], pErr: .12, errK: 1, pWrong: .06 } }, MIX = ['hard', 'normal', 'normal'];
// d = 방향 인지 지연, c = 색 인지 지연(초), rate = 연타(회/초, 전작 계측대로 난이도 무관 ≈10), pErr/errK = 색 인지 직후 오색 확률·횟수, pWrong = 옛 방향에 0.3~0.6초 더 연타할 확률. 60fps 시뮬 중앙값: Normal ≈ 14.7s · Hard ≈ 10.3s (§2차-5 목표 12~15 / 9~11)
const LAMP = { blue: '#3A7BFF', green: '#3FD35A' }, YEL = '#FFD23F', OFF = '#3a3f4a', GRAY = '#9A9A9A';
const CX = [0.27, 0.73, 0.27, 0.73].map(k => W * k), CY = [0.34, 0.34, 0.80, 0.80].map(k => H * k); // 사분면 중심: 1P 좌상 · 2P 우상 · 3P 좌하 · 4P 우하 (§6)
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0], BEAK = [[51, -49], [62, -35], [69, -19], [62, -35]]; // 방향 0 상 · 1 우 · 2 하 · 3 좌, 방향별 부리 끝 오프셋(scale 1.15, rot ±0.25 반영)
const GX = W / 2, GY = 52; // 상단 발전기 전구
let g, P, elapsed, phase, endT, full, sparks, popups, msg;

function setup() {
  elapsed = 0; phase = 'wait'; endT = 0; full = true; sparks = []; popups = []; msg = { s: '전극 방향을 보고! 파랑은 A, 초록은 B!', t: 2.5 };
  const mix = MIX.slice().sort(() => Math.random() - 0.5); // CPU 3명: 어려움 1 + 보통 2 를 무작위 슬롯에
  P = slots().map((s, i) => {
    const p = { ...s, cx: CX[i], cy: CY[i], mx: i % 2 ? CX[i] + 132 : CX[i] - 150, charge: 0, dir: -1, col: 'blue', lit: false, hold: 0, gap: 0, h: [20, 20, 20, 20], facing: -1, flip: i % 2 === 1,
      mash: 0, dizzy: 0, red: 0, jumpT: 0, wire: 0, last: -1, milestone: 0, errs: 0, airs: 0, win: false, seenCol: null, faceAt: 1e9, colorAt: 1e9, colorDone: true, err: 0, cd: 0 };
    if (!s.human) { const t = TIERS[mix.pop()]; p.dDelay = rand(...t.d); p.cDelay = rand(...t.c); p.rate = rand(...t.rate); p.pErr = t.pErr; p.errK = t.errK; p.pWrong = t.pWrong; }
    return p;
  });
}
function newElec(p, gap = GAP) { // 직전과 다른 방향 균등 랜덤, 색은 독립 50/50 (§5). 공백(하강 0.1 + pop 0.15) 중엔 입력 무효·무페널티
  let d; do d = Math.random() * 4 | 0; while (d === p.dir);
  p.dir = d; p.col = Math.random() < 0.5 ? 'blue' : 'green'; p.lit = false; p.gap = gap; p.errs = 0; p.airs = 0; p.faceAt = p.colorAt = 1e9; p.colorDone = true;
}
function light(p) { // 점등: 유지 {1, 1.5, 2}초. CPU는 방향 인지 → 색 인지 두 단계 지연 시각을 잡고, 그 전까지 옛 방향·옛 색으로 계속 누른다 (§8)
  p.lit = true; p.hold = HOLDS[rand(0, 3) | 0]; if (p.human) sfx.tick();
  else { p.faceAt = elapsed + p.dDelay * rand(0.7, 1.3) + (Math.random() < p.pWrong ? rand(0.3, 0.6) : 0); p.colorAt = p.faceAt + p.cDelay * rand(0.7, 1.3); p.colorDone = false; }
}
function face(p, d) { p.facing = d; if (d === 1) p.flip = false; else if (d === 3) p.flip = true; } // 좌우는 flip, 상하는 마지막 좌우를 유지한 채 고개만 기울임
function say(s, t = 1.5) { msg = { s, t }; }
function beak(p) { const [bx, by] = BEAK[p.facing < 0 ? 1 : p.facing]; return [p.cx + (p.flip ? -bx : bx), p.cy + by]; }
function spark(x, y, c, n, d, sp, fall) { for (let k = 0; k < n; k++) sparks.push({ x, y, vx: DX[d] * sp + rand(-70, 70), vy: DY[d] * sp + rand(-70, 70) + (fall ? 60 : 0), life: rand(0.25, 0.5), c, gr: fall ? 700 : 0 }); }
function press(p, btn) { // 유효 충전 = 방향 일치 AND 색 일치 (§3). 방향이 틀리면 허공에 회색 스파크만(무음·무페널티), 방향이 맞는데 색이 틀리면 방전 (§2차-9)
  if (phase !== 'race' || !p.lit || elapsed - p.last < CAP) return; // 공백 중 무효 · 연타 상한 15회/초
  p.last = elapsed; p.mash = 0.25; const [bx, by] = beak(p), gain = GAIN[p.human ? 'human' : 'cpu'];
  if (p.facing !== p.dir) { spark(bx, by, GRAY, 2, p.facing < 0 ? (p.flip ? 3 : 1) : p.facing, 140); if (p.human && ++p.airs === 4) say('방향을 먼저!'); return; }
  if ((btn === 'a') === (p.col === 'blue')) {
    p.charge = Math.min(FULL, p.charge + gain); spark(bx, by, LAMP[p.col], 5, p.dir, 260); p.wire = 0.15; if (p.human) sfx.tap();
    const m = Math.floor(p.charge / 25); if (m > p.milestone && p.charge < FULL) { p.milestone = m; p.jumpT = 0.35; if (p.human) sfx.pop(); } // 25/50/75% 통과 시 작은 점프
  } else {
    p.charge = Math.max(0, p.charge - 2 * gain); p.dizzy = 0.3; p.red = 0.2; spark(p.cx, p.cy - 10, GRAY, 5, 2, 90, true);
    popups.push({ s: '찌릿!', x: p.cx + (p.flip ? 46 : -46), y: p.cy - 46, life: 0.5 }); if (p.human) { sfx.bad(); if (++p.errs === 3) say('색을 잘 봐!'); }
  }
}
function endGame(ws, isFull) { // 100% 도달 프레임에 전원 입력 정지. 같은 프레임 동점자는 전원 승 (§4)
  phase = 'end'; endT = 0; full = isFull; popups = []; msg.t = 0; ws.forEach(p => { p.win = true; if (isFull) p.charge = FULL; });
  ws.some(p => p.human) ? sfx.win() : sfx.lose();
}

// ---- 그리기 헬퍼 ----
function outlined(ctx, s, x, y, size, fill, stroke = palette.white) { ctx.save(); ctx.font = `bold ${size}px sans-serif`; ctx.textAlign = 'center'; ctx.lineJoin = 'round'; ctx.lineWidth = size / 6; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); ctx.fillStyle = fill; ctx.fillText(s, x, y); ctx.restore(); }
function zap(ctx, x, y, s, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x + 4 * s, y - 14 * s); ctx.lineTo(x - 6 * s, y + 2 * s); ctx.lineTo(x + s, y + 2 * s); ctx.lineTo(x - 4 * s, y + 14 * s); ctx.lineTo(x + 6 * s, y - 2 * s); ctx.lineTo(x - s, y - 2 * s); ctx.closePath(); ctx.fill(); }
function bolt(ctx, x0, y0, x1, y1, w, c, j = 22) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(x0, y0); for (let k = 1; k < 7; k++) { const t = k / 7; ctx.lineTo(x0 + (x1 - x0) * t + rand(-j, j), y0 + (y1 - y0) * t + rand(-j / 3, j / 3)); } ctx.lineTo(x1, y1); ctx.stroke(); }
function electrode(ctx, x, y, h, c, letter) { // 3/4 뷰 원기둥 단자: 소켓 → 기둥(활성 시 22→40px 튀어오름) → 전구(점등 시 램프색 글로우 + 눌러야 할 버튼 글자, §6)
  ctx.fillStyle = '#232a40'; ctx.beginPath(); ctx.ellipse(x, y, 21, 8, 0, 0, 7); ctx.fill();
  rr(ctx, x - 17, y - h, 34, h, 5, '#6f7a8c'); rr(ctx, x - 15, y - h + 2, 7, h - 4, 3, '#8a95a8'); ctx.fillStyle = '#9aa5b8'; ctx.beginPath(); ctx.ellipse(x, y - h, 17, 6, 0, 0, 7); ctx.fill();
  const by = y - h - 9;
  if (c) { const gl = ctx.createRadialGradient(x, by, 6, x, by, 34); gl.addColorStop(0, c + 'AA'); gl.addColorStop(1, c + '00'); ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, by, 34, 0, 7); ctx.fill(); }
  ctx.fillStyle = c || OFF; ctx.beginPath(); ctx.arc(x, by, 11, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(x - 4, by - 4, 3, 0, 7); ctx.fill();
  if (letter) text(ctx, letter, x, by + 6, 17, palette.white);
}

g = Game({ id: 'pichu', title: '밍고 발전소', duration: 0,
  howto: ['튀어나온 전극 쪽으로 ←→↑↓ 를 눌러 바라보고', '파랑이면 A 버튼, 초록이면 B 버튼을 연타해 충전!', '틀린 색은 전기가 새요 · 먼저 100% 채우면 승리'],
  init() { setup(); },
  update(dt) {
    elapsed += dt;
    if (phase === 'wait' && elapsed >= LIGHT_AT) { phase = 'race'; P.forEach(p => newElec(p, 0.15)); sfx.pop(); } // GO 0.3초 뒤 첫 전극 pop (§7)
    if (phase === 'race') {
      P.forEach((p, i) => {
        if (!p.lit) { p.gap -= dt; if (p.gap <= 0) light(p); } else { p.hold -= dt; if (p.hold <= 0) newElec(p); }
        if (p.human) { // 방향은 홀드(axis)·hit 모두 인정, 마지막 방향 유지. A·B 동시는 오답 처리 (§3)
          const k = g.p(i), ax = k.axis(); let d = ['up', 'right', 'down', 'left'].findIndex(a => k.hit(a));
          if (d < 0 && (Math.abs(ax.x) >= 0.5 || Math.abs(ax.y) >= 0.5)) d = Math.abs(ax.x) > Math.abs(ax.y) ? (ax.x > 0 ? 1 : 3) : (ax.y > 0 ? 2 : 0);
          if (d >= 0) face(p, d);
          const a = k.hit('a'), b = k.hit('b'); if (a && b) press(p, p.col === 'blue' ? 'b' : 'a'); else if (a || b) press(p, a ? 'a' : 'b');
        } else { // CPU: 지연 동안 옛 방향·옛 색으로 계속 연타 → 허공 연타와 방전이 자연 발생. 연타 상한에 걸린 프레임은 타이머를 소모하지 않아 평균 속도 유지
          if (elapsed >= p.faceAt && p.facing !== p.dir) face(p, p.dir);
          if (elapsed >= p.colorAt && !p.colorDone) { p.colorDone = true; p.seenCol = p.col; if (Math.random() < p.pErr) p.err = 1 + (Math.random() * p.errK | 0); }
          if (p.seenCol) { p.cd -= dt; if (p.cd <= 0 && elapsed - p.last >= CAP) { let c = p.seenCol; if (p.err > 0 && p.facing === p.dir) { p.err--; c = c === 'blue' ? 'green' : 'blue'; } press(p, c === 'blue' ? 'a' : 'b'); p.cd += rand(0.85, 1.15) / p.rate; } }
        }
      });
      const ws = P.filter(p => p.charge >= FULL);
      if (ws.length) endGame(ws, true);
      else if (elapsed > SAFETY) { const top = Math.max(...P.map(p => p.charge)); endGame(P.filter(p => p.charge === top), false); } // 안전장치: 최다 충전자 승
    } else if (phase === 'end') { // 승자 번개 0.5초 → 0.3초 뒤 패자 감전 2초 → finish
      const was = endT; endT += dt; if (was < 0.3 && endT >= 0.3) { sfx.hit(); sfx.beep(90, 0.6, 'sawtooth', 0.05); } if (endT >= 2.4) g.finish();
    }
    if (elapsed > SAFETY + 8) g.finish();
    P.forEach(p => {
      ['mash', 'dizzy', 'red', 'jumpT', 'wire'].forEach(k => p[k] = Math.max(0, p[k] - dt));
      for (let d = 0; d < 4; d++) { const tg = phase === 'end' || (d === p.dir && (p.lit || p.gap <= 0.15)) ? 40 : 20; p.h[d] = clamp(p.h[d] + (tg > p.h[d] ? 140 : -200) * dt, 20, 40); } // pop 0.15s ↑ · 하강 0.1s ↓
    });
    sparks.forEach(s => { s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += s.gr * dt; }); sparks = sparks.filter(s => s.life > 0);
    popups.forEach(o => { o.life -= dt; o.y -= 40 * dt; }); popups = popups.filter(o => o.life > 0);
    if (msg.t > 0) msg.t -= dt;
  },
  draw(ctx) {
    const t = g.time, shock = phase === 'end' && endT >= 0.3 && endT < 2.3, top = P ? Math.max(...P.map(p => p.charge)) : 0;
    // 발전소 실내: 남색 그라데이션 + 바닥 격자 + 양옆 파이프 (§6)
    const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#151c33'); gr.addColorStop(1, '#26304f'); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#2f3a5a'; ctx.lineWidth = 1.5; for (let x = 0; x <= W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 40); ctx.lineTo(x, H); ctx.stroke(); } for (let y = 100; y <= H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    [14, W - 24].forEach(x => { rr(ctx, x, 40, 10, H - 40, 5, '#1e2742'); [150, 380].forEach(y => rr(ctx, x - 4, y, 18, 12, 4, '#2b3552')); });
    if (!P) return;
    // 발전기: 선두 충전량에 비례해 창이 노랗게 밝아지고, 종료 시 전구가 만개 (§6)
    rr(ctx, GX - 70, 134, 140, 12, 4, '#2c3550'); rr(ctx, GX - 60, 60, 120, 76, 14, '#4a5568'); rr(ctx, GX - 52, 66, 104, 10, 5, '#5b677d');
    rr(ctx, GX - 40, 82, 80, 36, 6, '#1b2238'); rr(ctx, GX - 40, 82, 80, 36, 6, `rgba(255,210,63,${phase === 'end' ? 0.95 : top / FULL * 0.85})`);
    ctx.strokeStyle = '#2c3550'; ctx.lineWidth = 2; [GX - 13, GX + 13].forEach(x => { ctx.beginPath(); ctx.moveTo(x, 82); ctx.lineTo(x, 118); ctx.stroke(); });
    const glow = phase === 'end' ? 1 : 0.2 + top / FULL * 0.5; ctx.fillStyle = `rgba(255,209,102,${glow * 0.5})`; ctx.beginPath(); ctx.arc(GX, GY, 24, 0, 7); ctx.fill(); ctx.fillStyle = palette.gold; ctx.beginPath(); ctx.arc(GX, GY, 9, 0, 7); ctx.fill();
    P.forEach((p, i) => {
      const litC = phase === 'end' ? palette.gold : LAMP[p.col];
      // 금속 발판 + 바라보는 방향 표식
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(p.cx + 4, p.cy + 40, 50, 16, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#4a5568'; ctx.beginPath(); ctx.ellipse(p.cx, p.cy + 36, 46, 15, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#5b677d'; ctx.beginPath(); ctx.ellipse(p.cx, p.cy + 34, 36, 10, 0, 0, 7); ctx.fill();
      if (p.facing >= 0 && phase !== 'end') { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.cx + DX[p.facing] * 40, p.cy + 36 + DY[p.facing] * 12, 5, 0, 7); ctx.fill(); }
      // 전극 4개: 위·좌·우 → 전기선 → 플라밍고 → 아래 순서로 겹침 처리. 종료 시 전부 노랗게 점등
      const el = d => { const on = phase === 'end' || (d === p.dir && p.lit); electrode(ctx, p.cx + DX[d] * E, p.cy + DY[d] * E, p.h[d], on ? litC : null, on && phase !== 'end' ? (p.col === 'blue' ? 'A' : 'B') : ''); };
      el(0); el(1); el(3);
      if (p.lit && phase !== 'end') { const d = p.dir; ctx.globalAlpha = ((t * 16) | 0) % 2 ? 0.9 : 0.35; bolt(ctx, p.cx + DX[d] * E, p.cy + DY[d] * E - p.h[d] - 9, p.cx, p.cy - 6, p.wire > 0 ? 4 : 2, LAMP[p.col], 6); ctx.globalAlpha = 1; }
      // 플라밍고 (§1): 대기 idle · 방향 flip/rot · 정답 연타 run+진동 · 오색 dizzy · 마일스톤 jump · 승자 fly→jump+번개 · 패자 hit→dizzy 흑백 깜빡임
      let pose = 'idle', dy = 0, col = p.color, shake = 0, rot = 0;
      if (phase === 'end') {
        if (p.win) { pose = endT < 0.5 ? 'fly' : 'jump'; dy = endT < 0.5 ? -endT * 40 : -20 - Math.abs(Math.sin(t * 6)) * 22; }
        else if (shock) { pose = endT < 0.9 ? 'hit' : 'dizzy'; col = ((t * 16) | 0) % 2 ? '#151515' : '#E6E6E6'; shake = endT < 0.9 ? 4 : 1; }
        else if (endT >= 2.3) { pose = 'dizzy'; dy = 6; }
      } else {
        rot = p.facing === 0 ? -0.25 : p.facing === 2 ? 0.25 : 0; if (p.flip) rot = -rot;
        if (p.jumpT > 0) dy = -Math.sin(Math.PI * (1 - p.jumpT / 0.35)) * 22;
        if (p.dizzy > 0) pose = 'dizzy'; else if (p.jumpT > 0) pose = 'jump'; else if (p.mash > 0) { pose = 'run'; shake = 3; }
      }
      const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
      drawFlamingo(ctx, p.cx + sx, p.cy + dy + sy, 1.15, pose, t + i, col, { flip: p.flip, rot });
      if (phase === 'end' && p.win) zap(ctx, p.cx, p.cy + dy - 76 + Math.sin(t * 5) * 4, 1.5, palette.gold);
      el(2);
      // 파워 미터(세로 18×120, 노랑 채움, 테두리 플레이어 색) + 배지 + % — 바깥쪽에 배치
      rr(ctx, p.mx - 3, p.cy - 63, 24, 126, 6, p.color); rr(ctx, p.mx, p.cy - 60, 18, 120, 4, '#1b2238');
      const fh = 120 * p.charge / FULL; rr(ctx, p.mx, p.cy + 60 - fh, 18, fh, 4, p.red > 0 ? palette.red : YEL);
      drawPlayerTag(ctx, p.mx + 9, p.cy - 80, i); text(ctx, `${Math.round(p.charge)}%`, p.mx + 9, p.cy + 82, 15, p.red > 0 ? palette.red : palette.cream);
    });
    if (phase === 'end') { // 승자 발판 → 발전기 굵은 번개 0.5초, 패자에게는 감전 번개 + 화면 플래시 (§7)
      if (endT < 0.5) P.forEach(p => { if (p.win) { bolt(ctx, GX, GY, p.cx, p.cy - 20, 12, YEL); bolt(ctx, GX, GY, p.cx, p.cy - 20, 4, palette.white); } });
      if (shock) { P.forEach(p => { if (!p.win && ((t * 16) | 0) % 2) bolt(ctx, GX, GY, p.cx, p.cy - 30, 4, YEL); }); ctx.fillStyle = `rgba(255,255,255,${0.06 + Math.random() * 0.1})`; ctx.fillRect(0, 0, W, H); }
    }
    sparks.forEach(s => { ctx.globalAlpha = clamp(s.life * 2.5, 0, 1); ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, 7); ctx.fill(); }); ctx.globalAlpha = 1;
    popups.forEach(o => { ctx.globalAlpha = clamp(o.life * 2, 0, 1); outlined(ctx, o.s, o.x, o.y, 24, palette.red); }); ctx.globalAlpha = 1;
    // 상단 안내 띠: 기본은 조작 요약, 아나운서 대사가 있으면 그것을 (§6~7)
    rr(ctx, 0, 0, W, 40, 0, 'rgba(8,12,28,.72)'); text(ctx, '먼저 100% 채우면 승리!', 16, 26, 15, '#c8d0e6', 'left');
    if (msg.t > 0) { ctx.globalAlpha = clamp(msg.t * 2, 0, 1); outlined(ctx, msg.s, GX, 29, 22, palette.gold, palette.ink); ctx.globalAlpha = 1; }
    else { text(ctx, '전극 쪽으로 ←→↑↓', GX - 130, 27, 17, palette.cream, 'right'); text(ctx, '파랑 = A 버튼', GX - 40, 27, 17, LAMP.blue); text(ctx, '초록 = B 버튼', GX + 80, 27, 17, LAMP.green); }
    if (phase === 'end' && endT >= 0.6 && g.state() === 'play') { // 종료 배너: 발전기 아래 빈 띠에, 승자 머리 위 번개를 가리지 않게 글자 폭만큼만
      const s = `⚡ ${P.filter(p => p.win).map(p => p.name).join('·')} ${full ? '만충전' : '최다 충전'}!`; ctx.font = 'bold 36px sans-serif'; const bw = ctx.measureText(s).width + 64;
      rr(ctx, GX - bw / 2, 154, bw, 68, 18, 'rgba(58,36,48,.85)'); outlined(ctx, s, GX, 201, 36, palette.gold, palette.ink);
    }
  },
  result() { const names = P.filter(p => p.win).map(p => p.name).join('·'); return { scores: P.map(p => Math.round(p.charge)), text: names ? `⚡ ${names} ${full ? '만충전' : '최다 충전'}!` : '' }; } });
</script></body></html>
