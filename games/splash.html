<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>플라밍고 스플래시 · Flamingo Stadium</title><link rel="stylesheet" href="../common/style.css"></head>
<body><div class="wrap"><canvas id="game"></canvas><div class="bar"><a href="../index.html">← 스타디움</a><span>조작: SPACE 연타</span></div></div>
<script src="../common/stadium.js"></script>
<script>
const { palette, drawFlamingo, Game, input, sfx, bg, text, rr, rand, clamp } = STADIUM;
let g;
const LANES = 4, GROUND = 430, BELL_Y = 150, GRAV = 1500;
const laneX = i => 150 + i * 220;
let lanes = [], parts = [], ripples = [], hits = [], elapsed = 0, shake = 0;

function mkLane(i, color, ai) {
  return { i, x: laneX(i), color, ai, meter: 0, y: 0, vy: 0, air: false, count: 0, bellSwing: 0, bellVel: 0, flash: 0,
    hitTimes: [], rate: ai ? rand(3, 5) : 0, aiTimer: 0, aiBurst: 0, cooldown: 0 };
}
function mash(L, now) {
  L.hitTimes.push(now); while (L.hitTimes.length && now - L.hitTimes[0] > 1) L.hitTimes.shift();
  const r = L.hitTimes.length; // mash rate per second
  L.meter = clamp(L.meter + 0.16 + r * 0.004, 0, 1);
  if (L.air) L.vy -= 60 + r * 8; // mid-air mashing gives extra lift (bounce)
  if (!L.ai) sfx.tap();
  if (L.meter >= 1 && !L.air) launch(L, r);
}
function launch(L, r) {
  L.air = true; L.meter = 0; L.vy = -(760 + Math.min(r, 14) * 26);
  for (let k = 0; k < 18; k++) parts.push({ x: L.x + rand(-20, 20), y: GROUND + 20, vx: rand(-220, 220), vy: rand(-380, -80), life: rand(0.4, 0.8), c: rand(0, 1) < 0.5 ? palette.water : palette.white });
  ripples.push({ x: L.x, y: GROUND + 22, r: 6, life: 0.8 });
}
function bell(L) {
  L.count++; L.flash = 0.25; L.bellVel += rand(6, 9) * (Math.random() < 0.5 ? -1 : 1); L.vy = Math.abs(L.vy) * 0.35 + 120;
  hits.push({ x: L.x, y: BELL_Y + 40, life: 0.6, s: '+1' });
  if (!L.ai) { sfx.good(); shake = 0.15; }
  for (let k = 0; k < 8; k++) parts.push({ x: L.x, y: BELL_Y + 30, vx: rand(-150, 150), vy: rand(-150, 50), life: 0.4, c: palette.gold });
}

g = Game({ id: 'splash', title: '플라밍고 스플래시', howto: ['SPACE 를 마구 연타해 게이지를 채우면 점프!', '점프 중에도 계속 연타하면 더 높이 튀어 종을 울려요', '30초 동안 라이벌 3마리보다 종을 많이 치면 승리'], duration: 30,
  init() {
    lanes = [mkLane(0, palette.pink, false), ...palette.rivals.map((c, i) => mkLane(i + 1, c, true))];
    parts = []; ripples = []; hits = []; elapsed = 0; shake = 0;
  },
  update(dt) {
    elapsed += dt; const now = elapsed; shake = Math.max(0, shake - dt);
    if (input.hit('Space')) mash(lanes[0], now);
    for (const L of lanes) {
      if (L.ai) { // rivals: base rate escalates over time, with bursts and breathers
        L.aiTimer -= dt;
        if (L.aiTimer <= 0) {
          L.aiBurst -= dt;
          if (L.aiBurst <= 0) { L.aiBurst = rand(1.5, 3.5); L.rate = rand(3.5, 5.5) + elapsed * 0.16 * (1 + L.i * 0.15) + (Math.random() < 0.3 ? 4 : 0); if (Math.random() < 0.18) L.cooldown = rand(0.5, 1.2); }
          if (L.cooldown > 0) L.cooldown -= dt; else mash(L, now);
          L.aiTimer = 1 / Math.max(1, L.rate) * rand(0.6, 1.4);
        }
      }
      while (L.hitTimes.length && now - L.hitTimes[0] > 1) L.hitTimes.shift();
      if (!L.air) L.meter = Math.max(0, L.meter - dt * 0.35);
      if (L.air) {
        L.vy += GRAV * dt; L.y += L.vy * dt;
        const headY = GROUND + L.y - 45; // head top of flamingo (scale 1.3)
        if (L.vy < 0 && headY <= BELL_Y + 40) bell(L);
        if (L.y >= 0) { L.y = 0; L.air = false; L.vy = 0; ripples.push({ x: L.x, y: GROUND + 22, r: 6, life: 0.6 });
          for (let k = 0; k < 8; k++) parts.push({ x: L.x + rand(-15, 15), y: GROUND + 20, vx: rand(-160, 160), vy: rand(-250, -60), life: 0.5, c: palette.water });
          if (L.hitTimes.length >= 6) { L.meter = 1; launch(L, L.hitTimes.length); } // fast masher re-bounces instantly
        }
      }
      L.bellVel -= L.bellSwing * 40 * dt; L.bellVel *= 1 - dt * 2; L.bellSwing += L.bellVel * dt; L.flash = Math.max(0, L.flash - dt);
    }
    for (const p of parts) { p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    for (const r of ripples) { r.r += 90 * dt; r.life -= dt; } ripples = ripples.filter(r => r.life > 0);
    for (const h of hits) { h.y -= 60 * dt; h.life -= dt; } hits = hits.filter(h => h.life > 0);
  },
  draw(ctx) {
    ctx.save(); if (shake > 0) ctx.translate(rand(-5, 5) * shake * 6, rand(-5, 5) * shake * 6);
    bg(ctx, g.W, g.H, palette.sky, '#FFE3EE');
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; for (let i = 0; i < 5; i++) { const cx = (i * 210 + g.time * 12) % (g.W + 120) - 60, cy = 60 + (i % 3) * 30; ctx.beginPath(); ctx.arc(cx, cy, 22, 0, 7); ctx.arc(cx + 24, cy - 8, 26, 0, 7); ctx.arc(cx + 50, cy, 20, 0, 7); ctx.fill(); }
    // top beam
    rr(ctx, 40, 90, g.W - 80, 18, 9, '#8C5A3C'); rr(ctx, 40, 90, g.W - 80, 6, 3, '#B07A55');
    // water
    ctx.fillStyle = palette.water; ctx.fillRect(0, GROUND + 18, g.W, g.H - GROUND);
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; for (let i = 0; i < 12; i++) { const wx = (i * 90 + Math.sin(g.time * 2 + i) * 12) % g.W; ctx.beginPath(); ctx.ellipse(wx, GROUND + 40 + (i % 3) * 25, 30, 4, 0, 0, 7); ctx.fill(); }
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; for (const r of ripples) { ctx.globalAlpha = r.life; ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r * 2, r.r * 0.6, 0, 0, 7); ctx.stroke(); } ctx.globalAlpha = 1;
    const sorted = [...lanes].sort((a, b) => b.count - a.count);
    for (const L of lanes) {
      // rope + bell
      ctx.save(); ctx.translate(L.x, 108); ctx.rotate(L.bellSwing * 0.04);
      ctx.strokeStyle = '#6B4A2E'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, BELL_Y - 108); ctx.stroke();
      ctx.translate(0, BELL_Y - 108); ctx.fillStyle = L.flash > 0 ? palette.white : palette.gold;
      ctx.beginPath(); ctx.moveTo(-18, 32); ctx.quadraticCurveTo(-18, -4, 0, -4); ctx.quadraticCurveTo(18, -4, 18, 32); ctx.closePath(); ctx.fill();
      rr(ctx, -22, 30, 44, 8, 4, '#D9A63C'); ctx.fillStyle = '#7A5A1E'; ctx.beginPath(); ctx.arc(0, 40, 5, 0, 7); ctx.fill(); ctx.restore();
      // lane counter
      const rank = sorted.indexOf(L);
      rr(ctx, L.x - 44, 20, 88, 56, 12, L.i === 0 ? palette.pinkDark : L.color);
      text(ctx, L.i === 0 ? '나' : `라이벌 ${L.i}`, L.x, 40, 14, palette.white);
      text(ctx, String(L.count), L.x, 68, 26, palette.white);
      if (rank === 0 && L.count > 0) text(ctx, '👑', L.x + 34, 32, 18);
      // meter
      const mw = 100, mx = L.x - mw / 2, my = GROUND + 78;
      rr(ctx, mx, my, mw, L.i === 0 ? 22 : 12, 6, 'rgba(58,36,48,0.35)');
      const fill = L.air ? 1 : L.meter; if (fill > 0) rr(ctx, mx, my, mw * fill, L.i === 0 ? 22 : 12, 6, fill >= 1 ? palette.white : L.i === 0 ? palette.gold : L.color);
      if (L.i === 0) { text(ctx, L.air ? '점프!!' : L.meter > 0.75 ? '조금만 더!' : 'SPACE 연타', L.x, my - 6, 15, palette.ink); }
      // flamingo
      const pose = L.air ? 'jump' : 'idle';
      drawFlamingo(ctx, L.x, GROUND + L.y - 8, 1.3, pose, g.time + L.i, L.color);
      if (L.air && L.vy < 0) { ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(L.x - 20 + k * 20, GROUND + L.y + 30); ctx.lineTo(L.x - 20 + k * 20, GROUND + L.y + 50 + k * 6); ctx.stroke(); } }
    }
    for (const p of parts) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 7); ctx.fill(); } ctx.globalAlpha = 1;
    for (const h of hits) { ctx.globalAlpha = h.life; text(ctx, h.s, h.x + 30, h.y, 24, palette.gold); } ctx.globalAlpha = 1;
    ctx.restore();
  },
  result() {
    const me = lanes[0].count, top = Math.max(...lanes.slice(1).map(l => l.count));
    const win = me > top;
    return { score: me, text: win ? `종 ${me}번! 라이벌 최고 ${top}번을 제쳤어요` : me === top ? `종 ${me}번, 라이벌과 동점… 아쉽게 패배` : `종 ${me}번, 라이벌 최고 ${top}번에 밀렸어요`, win };
  } });
</script></body></html>
