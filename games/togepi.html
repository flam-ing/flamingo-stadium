<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데굴데굴 플라밍고 · Flamingo Stadium</title><link rel="stylesheet" href="../common/style.css"></head>
<body><div class="wrap"><canvas id="game"></canvas><div class="bar"><a href="../index.html">← 스타디움</a><span>조작: ↓ 를 누른 채 달리기 · ←→ 로 회피 · 버튼 없음</span></div></div>
<script src="../common/stadium.js"></script>
<script>
// Tumbling Togepi (Pokémon Stadium 2) with flamingos — specs/togepi.md. 4 treadmill lanes side by side, runner fixed at foot y=150,
// terrain flows UP (DIR=+1, character runs toward the camera). 1 m = 14 px, track 200 m, no time limit: first to the goal wins,
// the rest keep running (20 s safety after the winner). ↓ hold = run 100 %, neutral ×0.75, ↑ ×0.3, ←→ dodge. No buttons.
const { palette, drawFlamingo, drawPlayerTag, Game, sfx, text, rr, rand, clamp, lerp, slots } = STADIUM;
const HUD = 44, FOOT = 150, PX = 14, TRACK = 200, BASE = 7, BT = 1.5, LANE = 240, MOVE = 380, DIR = 1, RETIRE = 20, LIMIT = 75;
const COL = c => 53.3 + c * 66.7, colOf = x => clamp(Math.round((x - 53.3) / 66.7), 0, 2), lx = p => p.i * LANE;
const HB = { arrow: [28, 20], flower: [18, 18], rock: [22, 16], log: [66, 11], dig: [11, 11] }; // hitbox half-extents (8 px smaller than art)
// course sections [end m, arrow gap m, obstacle density per m, max obstacles per row] (spec §5)
const SEG = [[40, 8, { flower: .05, rock: 0, log: .04 }, 1], [100, 9, { flower: .067, rock: .05, log: .05 }, 2],
  [170, 10, { flower: .083, rock: .067, log: .056 }, 2], [195, 10, { flower: .067, rock: .05, log: 0, dig: .12 }, 2]];
// CPU model (spec §8): see = perception distance (m), d = reaction delay [mean, σ] s, acc = takes the arrow column, miss = stays in a blocked
// column, dig = notices the Diglett mound, mv = strafe speed ×, jit = target wobble px, keep = chases the next arrow when boost is about to expire
// acc is the roll to go for an arrow; staying in an arrow column still hits it, so effective arrow rates come out ≈ 65 % / 85 % / 75 % (sim-tuned)
const AI = { normal: { see: 9, d: [.28, .08], acc: .45, miss: .12, dig: .35, mv: .85, jit: 18, keep: false },
  hard: { see: 13, d: [.17, .05], acc: .78, miss: .05, dig: .7, mv: 1, jit: 8, keep: true } };
AI.hardm = { ...AI.hard, acc: .62 };
const gauss = (m, s) => m + s * Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(Math.PI * 2 * Math.random());
let g, P, ROWS, parts, pops, caption, elapsed, firstT, endT, digWarned;

function makeCourse() { // one course shared by all 4 lanes: rows every 4–5.5 m, at least one column always free, arrows only in free columns
  const items = []; let m = 6, r = 0, aDue = 8;
  const add = (type, col, mm, x, ex) => items.push({ type, col, m: mm, r, x, ...ex });
  while (m < 195) {
    const [, agap, w, mx] = SEG.find(s => m < s[0]), step = rand(4, 5.5), hasA = m >= aDue, maxN = hasA ? 1 : mx; let free = [0, 1, 2], n = 0;
    if (!hasA && w.dig && Math.random() < w.dig * step) { // Diglett swarm before the goal: 2 columns × 1–2, random pop-up timing
      const keep = rand(0, 3) | 0; free = [keep];
      for (const c of [0, 1, 2]) if (c !== keep) for (let k = 0, kk = Math.random() < .5 ? 2 : 1; k < kk; k++) add('dig', c, m + k * 1.6, COL(c), { pop: rand(.6, 1.5) });
    } else for (const t of ['rock', 'flower', 'log']) {
      const need = t === 'log' ? 2 : 1; if (n >= maxN || free.length - need < 1 || Math.random() >= w[t] * step) continue;
      if (t === 'log') { const cs = free.filter(c => free.includes(c + 1)); if (!cs.length) continue; const c = cs[rand(0, cs.length) | 0]; add('log', c, m, COL(c) + 33.3); free = free.filter(v => v !== c && v !== c + 1); }
      else { const c = free[rand(0, free.length) | 0]; add(t, c, m, COL(c)); free = free.filter(v => v !== c); }
      n++;
    }
    if (hasA) { const c = free[rand(0, free.length) | 0]; add('arrow', c, m, COL(c)); aDue += agap * rand(.8, 1.2); } // arrow rows keep ≥2 free columns
    m += step; r++;
  }
  return items.sort((a, b) => a.m - b.m);
}
function say(s) { caption = { s, life: 2.4 }; }
function pop(x, y, s, c, big) { pops.push({ x, y, s, c, big, life: big ? .8 : .6 }); }
function burst(x, y, n, c, up = 160) { for (let k = 0; k < n; k++) parts.push({ x: x + rand(-10, 10), y, vx: rand(-120, 120), vy: rand(-up, -up * .3), life: rand(.35, .6), c, r: 3.5 }); }
function boost(p) { // blue arrow: level +1 (max 3), timer reset to BT — chaining arrows is the whole game (1.5 s: one miss breaks a Lv1–2 chain)
  p.lv = Math.min(3, p.lv + 1); p.bt = BT; if (p.human) sfx.good(); sfx.beep(600 + 200 * p.lv, .08, 'square', p.human ? .06 : .03);
  pop(lx(p) + p.x, FOOT - 74, `▶ Lv${p.lv}`, '#2f7dff');
}
function trip(p) { // rock / Diglett: tumble. hit 0.3 s (no input) + dizzy 0.6 s (strafe only), then invincible restart
  p.fall = .9; p.lv = 0; p.bt = 0; p.spd = 0; p.jump = 0; p.panic = .2; p.pend = null; p.plan = null; p.decided = p.curRow - 1; // CPU re-reads this row to sidestep
  sfx.pop(); sfx.beep(330, .08, 'triangle', .12); setTimeout(() => sfx.beep(220, .15, 'triangle', .12), 90); burst(lx(p) + p.x, FOOT, 6, '#b98b4e', 200);
}
function finishP(p) {
  p.done = true; p.ft = elapsed - (p.dist - TRACK) / Math.max(p.spd, .01); p.dist = TRACK; p.spd = 0; p.lv = 0; p.rank = P.filter(q => q.done).length; p.tape = .8;
  if (p.rank === 1) { firstT = elapsed; sfx.win(); say(`${p.name} 골인! ${p.ft.toFixed(2)}초`); } else sfx.good();
  pop(lx(p) + 120, 250, `${p.rank}위!`, p.rank === 1 ? palette.gold : palette.white, true);
  for (let k = 0; k < 10; k++) parts.push({ x: lx(p) + 40 + k * 16, y: FOOT + 10, vx: (k < 5 ? -1 : 1) * rand(80, 220), vy: rand(-220, -60), life: rand(.5, .9), c: p.color, r: 4 });
}
function decide(p, row, fromX) { // target column for one row (spec §8): arrow column with prob acc, else nearest free column; miss = stays in a blocked column
  const a = AI[p.ai], cur = colOf(fromX), blocked = [0, 0, 0], seeDig = Math.random() < a.dig; let arrow = -1;
  for (const o of row.items) {
    if (o.type === 'arrow') arrow = o.col;
    else if (o.type === 'log') { if (p.lv === 0) blocked[o.col] = blocked[o.col + 1] = 1; } // boosted = logs are free
    else if (o.type === 'dig') { if (seeDig) blocked[o.col] = 1; }
    else blocked[o.col] = 1;
  }
  let t = cur;
  if (arrow >= 0 && !blocked[arrow] && (Math.random() < a.acc || (a.keep && p.lv > 0 && p.bt < .5))) t = arrow;
  else if (blocked[cur] && Math.random() >= a.miss) t = [0, 1, 2].filter(c => !blocked[c]).sort((u, v) => Math.abs(u - cur) - Math.abs(v - cur))[0] ?? cur;
  return clamp(COL(t) + rand(-a.jit, a.jit), 40, 200);
}
function aiThink(p, dt) { // looks at rows inside its perception distance, reacts after a delay, keeps one row planned ahead
  const a = AI[p.ai], k = ROWS.findIndex(r => r.m > p.dist - .5), cur = ROWS[k];
  if (cur && cur.r !== p.curRow) { p.curRow = cur.r; if (p.plan && p.plan.r === cur.r) p.tx = p.plan.tx; p.plan = null; }
  if (!p.pend && !p.plan) { const nx = ROWS.slice(Math.max(0, k)).find(r => r.r > p.decided); if (nx && nx.m - p.dist <= a.see) { p.pend = nx; p.decided = nx.r; p.aiWait = p.react * rand(.7, 1.3) + p.panic; p.panic = 0; } }
  if (p.pend && (p.aiWait -= dt) <= 0) { const tx = decide(p, p.pend, p.pend.r === p.curRow ? p.x : p.tx); if (p.pend.r === p.curRow) p.tx = tx; else p.plan = { r: p.pend.r, tx }; p.pend = null; }
}
function step(p, dt) {
  const a = p.human ? null : AI[p.ai]; let dx = 0, run = 1;
  if (p.human) { const k = g.p(p.i).axis(); dx = k.x * MOVE * dt; run = k.y > 0 ? 1 : k.y < 0 ? .3 : .75; }
  else { aiThink(p, dt); dx = clamp(p.tx - p.x, -MOVE * a.mv * dt, MOVE * a.mv * dt); }
  if (p.fall > .6) dx = 0; // hit phase: no input at all; dizzy phase: strafe only
  p.x = clamp(p.x + dx, 40, 200);
  const wasF = p.fall > 0; p.fall -= dt; if (wasF && p.fall <= 0) { p.inv = .8; p.spd = BASE * run; } // restart at once, 0.8 s invincible (clears the obstacle you fell on)
  p.inv -= dt; p.jump -= dt; if ((p.bt -= dt) <= 0) p.lv = 0;
  const tgt = p.fall > 0 ? 0 : BASE * (1 + .35 * p.lv) * run * (p.onFl ? .45 : 1) * (p.jump > 0 && !p.jfree ? .6 : 1);
  p.spd = tgt >= p.spd ? Math.min(tgt, p.spd + 30 * dt) : Math.max(tgt, p.spd - 20 * dt); // 0→BASE in ~0.25 s, boost fade ~0.4 s
  p.dist += p.spd * dt; p.anim += dt * p.spd / BASE;
  let onFl = false;
  for (const o of p.course) {
    const dm = o.m - p.dist; if (dm < -3 || dm > 30) continue; o.fl -= dt;
    if (o.type === 'dig' && dm * PX + FOOT < 560) { const was = o.t; o.t += dt; if (was < o.pop && o.t >= o.pop) { sfx.beep(220, .12, 'square', p.human ? .08 : .04); burst(lx(p) + o.x, FOOT + dm * PX * DIR, 5, '#9b7653'); } }
    const [hw, hh] = HB[o.type]; if (Math.abs(dm * PX) > hh + 10 || Math.abs(o.x - p.x) > hw + 20) continue;
    if (o.type === 'dig' && o.t < o.pop + .17) continue; // not risen yet (half way up counts)
    if (o.type === 'arrow') { if (!o.used) { o.used = true; o.fl = .1; boost(p); } }
    else if (o.type === 'flower') { onFl = true; if (!p.onFl) { p.lv = 0; p.bt = 0; sfx.beep(660, .05, 'square', p.human ? .05 : .02); } }
    else if (o.type === 'log') { if (!o.used) { o.used = true; p.jfree = p.lv > 0; p.jump = p.jfree ? .3 : .45; if (!p.jfree) { p.lv = 0; p.bt = 0; } sfx.beep(p.jfree ? 1900 : 1500, .04, 'sine', .05); } }
    else if (p.inv <= 0 && p.fall <= 0) trip(p);
  }
  p.onFl = onFl; if (onFl && Math.random() < 6 * dt) parts.push({ x: lx(p) + p.x + rand(-14, 14), y: FOOT + 2, vx: rand(-40, 40), vy: rand(-90, -30), life: .5, c: '#ff8ac9', r: 3 });
  if (p.dist >= TRACK) finishP(p);
}

g = Game({ id: 'togepi', title: '데굴데굴 플라밍고', howto: ['↓ 를 누른 채 달리고 ←→ 로 꽃·바위·통나무·두더지를 피하세요', '파란 화살표를 연속으로 밟으면 점점 빨라집니다', '골인 지점에 먼저 도착하면 승리!'], duration: 0,
  init() {
    const items = makeCourse(); ROWS = []; items.forEach(o => (ROWS[o.r] = ROWS[o.r] || { r: o.r, m: o.m, items: [] }).items.push(o)); ROWS = ROWS.filter(Boolean);
    const cpuLv = g.humans >= 2 ? ['hard', 'hardm', 'hard'] : ['normal', 'hard', 'hardm']; let cpu = 0; // 1 human: Normal / Hard / Hard−, 2+ humans: Hard first
    P = slots().map((s, i) => { const ai = s.human ? null : cpuLv[cpu++]; return { ...s, x: 120, dist: 0, spd: 0, lv: 0, bt: 0, fall: 0, inv: 0, jump: 0, jfree: false, onFl: false, anim: rand(0, 5),
      done: false, retired: false, ft: 0, rank: 0, tape: 0, ai, react: ai ? Math.max(.05, gauss(AI[ai].d[0], AI[ai].d[1])) : 0, tx: 120, curRow: -1, decided: -1, aiWait: 0, pend: null, plan: null, panic: 0,
      course: items.map(o => ({ ...o, fl: 0, used: false, t: 0 })) }; });
    parts = []; pops = []; caption = null; elapsed = 0; firstT = null; endT = null; digWarned = false;
  },
  update(dt) {
    elapsed += dt;
    for (const p of P) if (!p.done && !p.retired) step(p, dt);
    for (const q of parts) { q.vy += 600 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; } parts = parts.filter(q => q.life > 0);
    for (const o of pops) { if (!o.big) o.y -= 50 * dt; o.life -= dt; } pops = pops.filter(o => o.life > 0);
    for (const p of P) p.tape -= dt;
    if (caption) { caption.life -= dt; if (caption.life <= 0) caption = null; }
    if (!digWarned && P.some(p => p.dist > 143)) { digWarned = true; say('골 앞에 두더지 떼가 기다려요!'); }
    if (P.every(p => p.done || p.retired)) { if (endT == null) endT = elapsed + 1.2; if (elapsed >= endT) g.finish(); } // let the last finish play out
    else if (firstT != null && elapsed - firstT >= RETIRE) { P.forEach(p => { if (!p.done) { p.retired = true; p.ft = elapsed; } }); say('시간 초과 — 리타이어'); sfx.bad(); }
    if (elapsed > LIMIT) g.finish(); // hard safety
  },
  draw(ctx) {
    ctx.fillStyle = '#7cc24f'; ctx.fillRect(0, 0, g.W, g.H);
    if (!P) return;
    for (const p of P) drawLane(ctx, p);
    rr(ctx, 0, 0, g.W, HUD, 0, palette.cream); ctx.fillStyle = 'rgba(58,36,48,.25)'; ctx.fillRect(0, HUD - 2, g.W, 2);
    for (const p of P) drawHud(ctx, p);
    if (firstT != null && P.some(q => !q.done && !q.retired)) text(ctx, `남은 시간 ${Math.max(0, Math.ceil(RETIRE - (elapsed - firstT)))}`, g.W / 2, 64, 13, 'rgba(58,36,48,.55)', 'center', 'normal');
    for (const q of parts) { ctx.globalAlpha = clamp(q.life * 2, 0, 1); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
    for (const o of pops) {
      ctx.globalAlpha = Math.min(1, o.life * 3);
      if (o.big) { const k = o.life > .55 ? lerp(1.8, 1, (0.8 - o.life) / .25) : 1; ctx.save(); ctx.translate(o.x, o.y); ctx.scale(k, k); text(ctx, o.s, 0, 0, 40, palette.ink); text(ctx, o.s, 0, -2, 40, o.c); ctx.restore(); }
      else text(ctx, o.s, o.x, o.y, 16, o.c);
    }
    ctx.globalAlpha = 1;
    if (caption) { ctx.globalAlpha = Math.min(1, caption.life); rr(ctx, g.W / 2 - 190, 496, 380, 30, 15, 'rgba(58,36,48,0.78)'); text(ctx, caption.s, g.W / 2, 517, 17, palette.cream); ctx.globalAlpha = 1; }
  },
  result() { // score = finish time (lower is better); unfinished = 999 − distance/1000 so they rank behind every finisher, by distance
    const w = P.find(p => p.rank === 1);
    return { scores: P.map(p => p.done ? +p.ft.toFixed(2) : +(999 - p.dist / 1000).toFixed(3)), lowerIsBetter: true, text: w ? `1위 ${w.name} ${w.ft.toFixed(2)}초` : '완주자 없음' };
  } });

function drawLane(ctx, p) {
  const x0 = lx(p); ctx.save(); ctx.beginPath(); ctx.rect(x0, HUD, LANE, g.H - HUD); ctx.clip();
  ctx.fillStyle = '#7cc24f'; ctx.fillRect(x0, HUD, LANE, g.H);
  ctx.fillStyle = '#93d45f'; const off = ((-p.dist * PX * DIR) % 56 + 56) % 56; for (let y = HUD - 56 + off; y < g.H; y += 56) ctx.fillRect(x0 + 20, y, 200, 28); // belt stripes flow up
  ctx.fillStyle = '#b98b4e'; ctx.fillRect(x0, HUD, 20, g.H); ctx.fillRect(x0 + 220, HUD, 20, g.H);
  ctx.globalAlpha = .4; ctx.fillStyle = p.color; ctx.fillRect(x0, HUD, 3, g.H); ctx.fillRect(x0 + 237, HUD, 3, g.H); ctx.globalAlpha = 1;
  const gy = FOOT + (TRACK - p.dist) * PX * DIR; // goal: checker band + sign + tape
  if (gy > HUD - 60 && gy < g.H + 40) {
    for (let k = 0; k < 10; k++) for (let j = 0; j < 2; j++) { ctx.fillStyle = (k + j) % 2 ? palette.ink : palette.white; ctx.fillRect(x0 + 20 + k * 20, gy - 12 + j * 12, 20, 12); }
    rr(ctx, x0 + 80, gy - 44, 80, 26, 6, palette.white); text(ctx, 'GOAL', x0 + 120, gy - 25, 17, palette.ink);
    if (!p.done) { ctx.strokeStyle = p.color; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x0 + 20, gy - 2); ctx.lineTo(x0 + 220, gy - 2); ctx.stroke(); }
    else if (p.tape > 0) { const k = (0.8 - p.tape) * 300; ctx.strokeStyle = p.color; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x0 + 20 - k, gy - 2); ctx.lineTo(x0 + 110 - k, gy - 2 - k * .6); ctx.moveTo(x0 + 130 + k, gy - 2 - k * .6); ctx.lineTo(x0 + 220 + k, gy - 2); ctx.stroke(); }
  }
  for (const q of P) if (q !== p) { // ghosts of the other three at their real progress offset (ahead = below, toward the camera)
    const y = FOOT + (q.dist - p.dist) * PX * DIR, ahead = q.dist > p.dist, dd = Math.round(Math.abs(q.dist - p.dist));
    if (y > HUD + 40 && y < g.H - 10) drawFlamingo(ctx, x0 + q.x, y - 30, .9, q.done ? 'idle' : 'run', g.time + q.i, q.color, { alpha: .35 });
    else if (dd > 0) text(ctx, `${ahead ? '▼' : '▲'}${dd}m`, x0 + 45 + q.i * 50, ahead ? g.H - 8 : HUD + 20, 12, q.color, 'center');
  }
  const vis = p.course.filter(o => { o.sy = FOOT + (o.m - p.dist) * PX * DIR; return o.sy > HUD - 60 && o.sy < g.H + 60; });
  for (const o of vis) if (o.sy < FOOT) drawItem(ctx, o, x0 + o.x, o.sy);
  drawChar(ctx, p, x0 + p.x);
  for (const o of vis) if (o.sy >= FOOT) drawItem(ctx, o, x0 + o.x, o.sy);
  if (p.human && g.state() === 'play' && elapsed < 5) text(ctx, '↓ 누른 채 달려요!', x0 + 120, FOOT + 60, 15, palette.pinkDark);
  if (p.retired) { ctx.fillStyle = 'rgba(70,70,70,.55)'; ctx.fillRect(x0, HUD, LANE, g.H); text(ctx, '리타이어', x0 + 120, 320, 30, palette.white); }
  ctx.restore();
}
function drawItem(ctx, o, x, y) {
  if (o.type === 'arrow') { rr(ctx, x - 32, y - 24, 64, 48, 8, o.fl > 0 ? palette.white : '#2f7dff'); ctx.fillStyle = o.fl > 0 ? '#2f7dff' : palette.white; ctx.fillRect(x - 7, y - 18, 14, 16); ctx.beginPath(); ctx.moveTo(x - 20, y - 4); ctx.lineTo(x + 20, y - 4); ctx.lineTo(x, y + 18); ctx.closePath(); ctx.fill(); }
  else if (o.type === 'flower') { ctx.fillStyle = '#5fa63c'; ctx.beginPath(); ctx.arc(x, y, 22, 0, 7); ctx.fill(); ctx.fillStyle = '#ff8ac9'; for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.arc(x + Math.cos(k * 1.047) * 13, y + Math.sin(k * 1.047) * 13, 7, 0, 7); ctx.fill(); } ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill(); }
  else if (o.type === 'rock') { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(x + 3, y + 8, 26, 14, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#8f8f8f'; ctx.beginPath(); ctx.ellipse(x, y, 26, 20, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#b5b5b5'; ctx.beginPath(); ctx.ellipse(x - 7, y - 7, 10, 6, -.5, 0, 7); ctx.fill(); }
  else if (o.type === 'log') { rr(ctx, x - 70, y - 15, 140, 30, 9, '#8b5a2b'); ctx.fillStyle = '#6e4520'; for (let k = -45; k <= 45; k += 30) ctx.fillRect(x + k - 2, y - 12, 4, 24); ctx.fillStyle = '#d9a066'; ctx.beginPath(); ctx.ellipse(x + 64, y, 9, 15, 0, 0, 7); ctx.fill(); ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(x + 64, y, 5, 8, 0, 0, 7); ctx.stroke(); }
  else if (o.type === 'dig') { // hidden → shaking mound (0.4 s warning) → rises over 0.35 s
    if (o.t < o.pop - .4) return;
    const k = clamp((o.t - o.pop) / .35, 0, 1), sh = k < 1 ? rand(-2, 2) : 0;
    if (k > 0) { ctx.save(); ctx.beginPath(); ctx.rect(x - 40, y - 60, 80, 62); ctx.clip(); drawFlamingo(ctx, x + sh, y + 14 - k * 30, .55, 'dig', g.time, '#9b7653'); ctx.restore(); }
    ctx.fillStyle = '#7a5a3a'; ctx.beginPath(); ctx.ellipse(x + sh, y + 2, 15, 8, 0, 0, 7); ctx.fill();
  }
}
function drawChar(ctx, p, X) {
  const st = g.state(); let pose = 'idle', Y = FOOT - 36;
  if (p.retired) pose = 'sleep';
  else if (p.done) { if (p.rank === 1) { pose = 'jump'; Y -= Math.abs(Math.sin(g.time * 5)) * 30; } }
  else if (st === 'play' || st === 'end') {
    if (p.fall > .6) { pose = 'hit'; Y -= 8; } else if (p.fall > 0) pose = 'dizzy';
    else if (p.jump > 0) { pose = 'jump'; Y -= Math.sin(Math.PI * clamp(p.jump / (p.jfree ? .3 : .45), 0, 1)) * 28; }
    else if (p.lv > 0) pose = 'fly'; else if (p.spd > .5) pose = 'run';
  }
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(X, FOOT + 4, 22, 7, 0, 0, 7); ctx.fill();

}
function drawHud(ctx, p) { // tag · rank badge · timer / progress bar · goal flag · boost ▶▶▶

  rr(ctx, x0 + 12, 27, 150, 9, 4, 'rgba(58,36,48,.15)'); rr(ctx, x0 + 12, 27, 150 * clamp(p.dist / TRACK, 0, 1), 9, 4, p.color);
  for (let j = 0; j < 2; j++) for (let k = 0; k < 2; k++) { ctx.fillStyle = (j + k) % 2 ? palette.ink : palette.white; ctx.fillRect(x0 + 164 + k * 5, 26 + j * 5, 5, 5); }
  for (let k = 0; k < 3; k++) { ctx.fillStyle = k < p.lv ? '#2f7dff' : 'rgba(58,36,48,.15)'; ctx.beginPath(); ctx.moveTo(x0 + 182 + k * 16, 25); ctx.lineTo(x0 + 194 + k * 16, 31.5); ctx.lineTo(x0 + 182 + k * 16, 38); ctx.closePath(); ctx.fill(); }
}
