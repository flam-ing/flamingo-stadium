<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>잽싼 밍고 · Flamingo Stadium</title><link rel="stylesheet" href="../common/style.css"></head>
<body><div class="wrap"><canvas id="game"></canvas><div class="bar"><a href="../index.html">← 스타디움</a><span>조작: 뚜껑이 열리는 순간 A 버튼 · B 버튼은 페이크 (닫힌 뚜껑에 A 버튼 = 플라잉)</span></div></div>
<script src="../common/stadium.js"></script>
<script>
const { palette, drawFlamingo, drawPlayerTag, Game, sfx, bg, text, rr, rand, clamp, lerp, slots } = STADIUM;
// 원작 Eager Eevee (specs/eevee.md): 4마리가 뚜껑 둘레를 돌다 음악이 멈추고 뚜껑이 열리면 A! 제일 빠른 쪽이 과일(딸기 100×개수 · 포도 500 · 멜론 1000).
// 닫힌 뚜껑에 A = 플라잉(스턴 2.0s). 피콘을 물면 펑 → 다음 라운드 휴식(5라운드면 -500). B = 페이크 대시. 5라운드 합계 최다 승리.
const CX = 480, CY = 320, RX = 250, RY = 120, LX = 480, LY = 300, ROT = Math.PI / 3, ROUNDS = 5, STUN = 2.0, WIN = 1.2, GRACE = .35, AIPOM = '#9b6bd6', REST = { x: 100, y: 430 };
const PROB = [[.5, .35, .15, 0], [.4, .35, .2, .05], [.3, .3, .25, .15], [.2, .25, .2, .35], [0, .25, .65, .1]]; // 라운드별 딸기/포도/멜론/피콘 확률 (§4)
const CIRC = [4, 5, 6, 6, 6], FAKES = [[0, 0], [0, 1], [1, 1], [1, 2], [1, 2]]; // 돌기 상한(초, 하한 2.5) · 에이팜 페이크 횟수 범위 (§5)
const KIND = ['berry', 'grape', 'melon', 'pineco'], VAL = { grape: 500, melon: 1000 };
// COM 모델 (§8 Normal/Hard): r 반응[평균,σ]초 · fooled 에이팜 페이크에 낚임 · bite 피콘 그냥 묾 · fs 자발적 플라잉/초 · bf B페이크/초 · follow 남의 돌진 따라감 · bfp 피콘 확인 후 B페이크
const AI = { normal: { r: [.36, .09], fooled: .3, bite: .6, fs: .02, bf: .2, follow: .35, bfp: .25 }, hard: { r: [.27, .06], fooled: .15, bite: .3, fs: .01, bf: .3, follow: .2, bfp: .5 } };
const gauss = (m, s) => m + s * Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(Math.PI * 2 * Math.random());
const react = p => Math.max(.06, gauss(AI[p.lv].r[0], AI[p.lv].r[1]));
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const pick = pr => { let r = Math.random(), k = 0; while (k < 3 && (r -= pr[k]) > 0) k++; return k; };
let g, P, ph, round, base, fruit, lid, now, elapsed, beat, note, fakeT, fakes, qT, arr, closed, caption, pops, parts, flash, shake, boomV;

const trackPos = i => { const a = base + i * Math.PI / 2; return { x: CX + RX * Math.cos(a), y: CY + RY * Math.sin(a), a }; }; // 트랙 위 자기 슬롯 (base + i·90°)
const edgePos = p => { const a = Math.atan2((p.y - LY) / 55, (p.x - LX) / 120); return { x: LX + 120 * Math.cos(a), y: LY + 55 * Math.sin(a) }; }; // 뚜껑 가장자리 돌진 지점 (§6)
function say(s, life, c) { caption = { s, life, c: c || palette.cream }; }
function pop(x, y, s, c) { pops.push({ x, y, s, c, life: 1 }); }
function burst(x, y, n, c) { for (let k = 0; k < n; k++) parts.push({ x, y, vx: rand(-260, 260), vy: rand(-320, -60), life: rand(.4, .7), c }); }
function goBack(p) { p.st = 'back'; p.t = 0; p.fx = p.x; p.fy = p.y; }

function phase(n, dur) {
  ph = { n, t: 0, dur };
  if (n === 'intro') { // 라운드 준비: 과일 뽑기(딸기 6~10개), 휴식자 배치, 라운드 플래그 초기화. 스턴은 그대로 이어짐
    round++; arr = []; closed = false; fakeT = -1; fruit = { kind: KIND[pick(PROB[round - 1])], n: 6 + (Math.random() * 5 | 0), pop: 0, gone: false };
    for (const p of P) { Object.assign(p, { dashed: false, rank: 0, gain: 0, applied: false, arrived: false, check: false, planA: -1, planB: -1, seen: false, followed: false, burnt: false, boomT: 0 });
      if (p.restNext) { p.st = 'rest'; p.t = 0; } else if (p.st === 'rest') goBack(p); else if (p.st !== 'stun') { p.st = 'run'; p.t = 0; } p.restNext = false; }
    say(round === ROUNDS ? '마지막 라운드! 가장 큰 점수가 걸려 있습니다!' : `라운드 ${round} / ${ROUNDS}`, 1.2);
  } else if (n === 'circle') { // 돌기: 메트로놈 시작 + 에이팜 페이크 예약(시작 0.6s 뒤 ~ 진짜 열기 0.8s 전)
    beat = 0; const [lo, hi] = FAKES[round - 1], nf = lo + (Math.random() * (hi - lo + 1) | 0);
    fakes = []; for (let k = 0; k < nf; k++) fakes.push(rand(.6, dur - 1.05)); fakes.sort((a, b) => b - a);
    if (round === 1) { say('음악이 멈추는 순간을 노리세요!', 1.5); sfx.tap(); setTimeout(() => sfx.tap(), 160); }
  } else if (n === 'open') { sfx.beep(1400, .1, 'square', .12); for (const p of P) if (!p.human && p.st === 'run') aiOpen(p); }
  else if (n === 'settle') { sfx.tick(); for (const p of P) if (p.st === 'eat' || p.st === 'idle' || p.st === 'boom') goBack(p); }
  else if (n === 'over') { const max = Math.max(...P.map(p => p.score)); say(`승자는 ${P.filter(p => p.score === max).map(p => p.name).join('·')}!`, 2); for (const p of P) if (p.st !== 'rest' && p.st !== 'run' && p.st !== 'stun') goBack(p); }
}
function pressA(p) { // 상태별 입력표 (§11.1): circle/silence = 플라잉, open = 돌진(라운드당 1회), 그 외 무시. 스턴·휴식·복귀 중 무시
  if (p.st !== 'run' || p.dashed) return;
  if (ph.n === 'circle' || ph.n === 'silence') { p.st = 'stun'; p.t = 0; p.fx = p.x; p.fy = p.y; const e = edgePos(p); p.tx = e.x; p.ty = e.y; sfx.bad(); say(p.human ? '앗, 너무 빨랐어요! 플라잉!' : `${p.name} 플라잉!`, .8, p.color); aiSee(p); return; }
  if (ph.n !== 'open') return;
  p.dashed = true; p.st = 'dash'; p.t = 0; p.fx = p.x; p.fy = p.y; const e = edgePos(p); p.tx = e.x; p.ty = e.y;
  const f = arr.filter(a => a.rank === 1), s = arr.find(a => a.rank === 2); let rank = 3; // 같은 프레임(같은 ph.t) = 동시 도착 (§11.7)
  if (!f.length || ph.t - f[0].t < .001) rank = 1; else if (fruit.kind === 'berry' && f.length === 1 && ph.t - f[0].t <= GRACE && (!s || ph.t - s.t < .001)) rank = 2;
  p.rank = rank; arr.push({ i: p.i, t: ph.t, rank }); sfx.beep(p.human ? 900 : 720, .06, 'square', .06);
  if (rank <= 2) { p.tx = lerp(p.tx, LX, .3); p.ty = lerp(p.ty, LY, .3); } // 1·2등만 접시까지 더 들어감 (§11.4)
  aiSee(p);
}
function pressB(p) { if (p.st !== 'run' || p.fakeCd > 0 || !/circle|silence|open/.test(ph.n)) return; p.fakeT = .3; p.fakeCd = .5; sfx.tap(); aiSee(p); }
function aiSee(p) { // 남의 돌진·페이크를 본 COM: open 중이면 p_follow로 따라감(피콘 심리전), 돌기 중이면 p_fooled/2로 낚여 플라잉
  for (const q of P) { if (q.human || q === p || q.st !== 'run' || q.dashed) continue; const a = AI[q.lv];
    if (ph.n === 'open') { if (q.planA < 0 && !q.followed && Math.random() < a.follow) { q.followed = true; q.planA = now + react(q); } }
    else if (!q.seen && Math.random() < a.fooled * .5) { q.seen = true; q.planA = now + react(q); } }
}
function aiOpen(p) { const a = AI[p.lv]; if (fruit.kind === 'pineco' && Math.random() >= a.bite) { p.check = true; if (Math.random() < a.bfp) p.planB = now + react(p); } else p.planA = now + react(p); }
function closeWin() { // 창 닫기 (§11.8): 도착 순위별 몫 확정. 딸기 1등 ceil(N×0.6), 2등 나머지(1등이 1명일 때만) — 동시 도착은 몫을 올림 나눔
  closed = true; const f = arr.filter(a => a.rank === 1), s2 = arr.filter(a => a.rank === 2), k = fruit.kind;
  if (!f.length) { say('아무도 못 먹었다…', 1); phase('resolve', .8); return; }
  const top = Math.ceil(fruit.n * .6);
  for (const a of arr) P[a.i].gain = k === 'pineco' ? (a.rank === 1 ? -1 : 0) : k === 'berry' ? (a.rank === 1 ? Math.ceil(top / f.length) : f.length === 1 && a.rank === 2 ? Math.ceil((fruit.n - top) / s2.length) : 0) * 100 : a.rank === 1 ? VAL[k] : 0;
  if (f.length > 1) say('동시!', 1);
  phase('resolve', k === 'pineco' ? 2.4 : 1.6);
}
function applyGain(p) { p.applied = true;
  if (p.gain > 0) { p.score += p.gain; pop(p.x, p.y - 95, '+' + p.gain, p.rank === 1 ? palette.gold : palette.white); p.rank === 1 ? sfx.good() : sfx.tap(); if (fruit.kind === 'melon') say('멜론이다! 1000점!', 1); }
  else if (p.gain < 0) p.boomT = .2; // 피콘: 문 뒤 0.2s 뒤 폭발
}
function explode(p) { // 피콘 폭발: 흰→주황 플래시 + 화면 흔들림 + 파티클. 문 플레이어는 그을려 다음 라운드 휴식(5라운드면 -500, 최저 0)
  flash = .1; shake = .3; boomV = .3; burst(LX, LY - 10, 12, '#ff8c42'); sfx.hit(); fruit.gone = true; p.st = 'boom'; p.t = 0; p.burnt = true;
  if (round < ROUNDS) { p.restNext = true; say(`펑! 피콘이었습니다… ${p.name}는 다음 라운드 휴식`, 1.4, p.color); } else { p.score = Math.max(0, p.score - 500); pop(p.x, p.y - 95, '-500', palette.red); say('펑! 마지막 라운드라 -500점', 1.4, p.color); }
  for (const q of P) if (q !== p && q.arrived && q.st !== 'boom') q.fakeT = .3; // 2등 이하는 놀라 뒤로 점프
}
function stepP(p, dt) {
  const tp = trackPos(p.i); p.t += dt;
  if (p.st === 'run') { p.x = tp.x; p.y = tp.y; }
  else if (p.st === 'rest') { const k = Math.min(1, dt * 5); p.x = lerp(p.x, REST.x, k); p.y = lerp(p.y, REST.y, k); }
  else if (p.st === 'dash') { const k = Math.min(1, p.t / .25); p.x = lerp(p.fx, p.tx, k); p.y = lerp(p.fy, p.ty, k); if (k >= 1) { p.arrived = true; p.st = p.rank <= 2 ? 'eat' : 'idle'; p.t = 0; } }
  else if (p.st === 'eat' && p.t >= .8) { p.st = 'idle'; if (p.gain > 0) fruit.gone = true; }
  else if (p.st === 'stun') { // 플라잉: 가장자리까지 fly(0.25) → hit로 튕겨 자기 슬롯 복귀(0.3) → dizzy로 원 회전에 실려감 (§11.3). 합계 2.0s
    if (p.t < .25) { const k = p.t / .25; p.x = lerp(p.fx, p.tx, k); p.y = lerp(p.fy, p.ty, k); } else if (p.t < .55) { const k = (p.t - .25) / .3; p.x = lerp(p.tx, tp.x, k); p.y = lerp(p.ty, tp.y, k); } else { p.x = tp.x; p.y = tp.y; }
    if (p.t >= STUN) { p.st = 'run'; if (!p.human && ph.n === 'open' && !closed) p.planA = now + react(p) * .5; } // 열림 중 풀리면 늦게라도 돌진
  } else if (p.st === 'back') { const k = Math.min(1, p.t / .4); p.x = lerp(p.fx, tp.x, k); p.y = lerp(p.fy, tp.y, k); if (k >= 1) p.st = 'run'; }
  else if (p.st === 'boom' && p.t >= 1.2) p.st = 'idle';
  if (p.boomT > 0 && (p.boomT -= dt) <= 0) explode(p);
  if (p.arrived && closed && !p.applied) applyGain(p);
}

g = Game({ id: 'eevee', title: '잽싼 밍고', howto: ['음악이 멈추고 뚜껑이 열리면 A 버튼! 제일 빠른 밍고가 과일을 먹어요', '닫힌 뚜껑에 A 버튼은 플라잉(2초 기절) · B 버튼은 페이크로 상대 낚기', '피콘(솔방울)을 물면 펑! 다음 라운드 휴식 · 5라운드 합계로 승부'], duration: 0,
  init() {
    // 항상 4마리. 사람이면 입력, 아니면 COM — 사람 다음 첫 COM = Hard, 나머지 Normal (§11.2)
    P = slots().map((s, i) => ({ ...s, score: 0, lv: i === g.humans ? 'hard' : 'normal', st: 'run', t: 0, x: 0, y: 0, fx: 0, fy: 0, tx: 0, ty: 0, fakeT: 0, fakeCd: 0, restNext: false }));
    round = 0; base = -Math.PI / 2; now = 0; elapsed = 0; lid = 0; note = 0; qT = 0; fakeT = -1; fakes = []; arr = []; closed = false; caption = null; pops = []; parts = []; flash = 0; shake = 0; boomV = 0;
    phase('intro', 1); P.forEach(p => { const tp = trackPos(p.i); p.x = tp.x; p.y = tp.y; });
  },
  update(dt) {
    elapsed += dt; now += dt; ph.t += dt; if (elapsed > 90) g.finish(); // 안전장치 (정상 종료는 5라운드 뒤 over 단계)
    note -= dt; qT -= dt; flash -= dt; shake -= dt; boomV -= dt;
    if (ph.n === 'intro') { lid = 0; if (ph.t >= ph.dur) phase('circle', rand(2.5, CIRC[round - 1])); }
    else if (ph.n === 'circle') { // 60°/s 회전, 0.5s 메트로놈(120BPM), 에이팜 페이크 = lift 0→0.35→0 (0.25s), COM은 p_fooled로 낚임
      base += ROT * dt; beat -= dt; if (beat <= 0) { beat += .5; sfx.beep(660, .05, 'square', .15); note = .15; }
      if (fakeT >= 0 && (fakeT += dt) > .25) fakeT = -1;
      if (fakes.length && ph.t >= fakes[fakes.length - 1]) { fakes.pop(); fakeT = 0; qT = .4; sfx.pop(); say('에이팜의 페이크! 속지 마세요!', .7); for (const p of P) if (!p.human && p.st === 'run' && Math.random() < AI[p.lv].fooled) p.planA = now + react(p); }
      lid = fakeT >= 0 ? .35 * Math.sin(Math.PI * fakeT / .25) : 0;
      if (ph.t >= ph.dur) phase('silence', .12); // 음악 정지 → 0.12s 정적 → 열림
    } else if (ph.n === 'silence') { lid = 0; if (ph.t >= ph.dur) phase('open', WIN); }
    else if (ph.n === 'open') lid = fruit.pop = Math.min(1, ph.t / .15);
    else if (ph.n === 'resolve') { lid = 1; if (ph.t >= ph.dur) phase('settle', .8); }
    else if (ph.n === 'settle') { lid = Math.max(0, 1 - ph.t / .3); if (ph.t >= ph.dur) round < ROUNDS ? phase('intro', 1) : phase('over', 1.5); }
    else if (ph.n === 'over' && ph.t >= ph.dur) g.finish();
    for (const p of P) {
      if (p.human) { const k = g.p(p.i); if (k.hit('a')) pressA(p); if (k.hit('b')) pressB(p); }
      else { if (p.planA >= 0 && now >= p.planA) { p.planA = -1; pressA(p); } if (p.planB >= 0 && now >= p.planB) { p.planB = -1; pressB(p); }
        if (ph.n === 'circle' && p.st === 'run') { const a = AI[p.lv]; if (Math.random() < a.fs * dt) pressA(p); else if (Math.random() < a.bf * dt) pressB(p); } }
      p.fakeCd -= dt; p.fakeT -= dt; stepP(p, dt);
    }
    if (ph.n === 'open') { const f = arr.filter(a => a.rank === 1); if (f.length && (fruit.kind !== 'berry' || f.length > 1 || arr.length > f.length || ph.t - f[0].t >= GRACE) || ph.t >= WIN) closeWin(); }
    for (const q of parts) { q.vy += 700 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; } parts = parts.filter(q => q.life > 0);
    for (const o of pops) { o.y -= 50 * dt; o.life -= dt; } pops = pops.filter(o => o.life > 0);
    if (caption && (caption.life -= dt) <= 0) caption = null;
  },
  draw(ctx) {
    ctx.save(); if (shake > 0) ctx.translate(rand(-6, 6) * shake / .3, rand(-4, 4) * shake / .3);
    bg(ctx, g.W, g.H, palette.sky, '#FFE9D2');
    [[130, 150], [480, 128], [830, 150]].forEach(([x, y]) => { rr(ctx, x - 8, y, 16, 70, 4, '#8C5A3C'); ctx.fillStyle = '#5fb04a'; [[0, -8, 38], [-30, 12, 26], [30, 12, 26]].forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(x + dx, y + dy, r, 0, 7); ctx.fill(); }); });
    ctx.fillStyle = '#7cc257'; ctx.strokeStyle = '#5a9a3c'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(480, 330, 345, 178, 0, 0, 7); ctx.fill(); ctx.stroke(); // 잔디 무대
    ctx.strokeStyle = '#d9b27a'; ctx.lineWidth = 40; ctx.beginPath(); ctx.ellipse(CX, CY, RX, RY, 0, 0, 7); ctx.stroke(); // 흙길 트랙
    if (P) {
      ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(LX, LY + 12, 114, 42, 0, 0, 7); ctx.fill(); // 뚜껑 그림자(바닥 고정)
      const items = P.map(p => ({ y: p.y, f: () => drawP(ctx, p) })), lk = LY + 8 - 110 * lid; // y 정렬로 앞뒤 겹침 처리. 뚜껑(+위에 선 에이팜)은 들릴수록 뒤로 보내 트랙 북쪽 플레이어를 가리지 않게
      items.push({ y: LY - 50, f: () => drawPlate(ctx) }, { y: lk, f: () => drawLid(ctx) }, { y: lk + 1, f: () => drawAipom(ctx) });
      items.sort((a, b) => a.y - b.y).forEach(o => o.f());
      if (boomV > 0) { ctx.globalAlpha = boomV / .3; ctx.fillStyle = boomV > .2 ? palette.white : '#ff8c42'; ctx.beginPath(); ctx.arc(LX, LY - 10, 160 * (1.3 - boomV / .3), 0, 7); ctx.fill(); }
      for (const q of parts) { ctx.globalAlpha = clamp(q.life * 2, 0, 1); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, 5, 0, 7); ctx.fill(); }
      for (const o of pops) { ctx.globalAlpha = Math.min(1, o.life * 2); text(ctx, o.s, o.x, o.y, 26, palette.ink); text(ctx, o.s, o.x, o.y - 2, 26, o.c); }
      ctx.globalAlpha = 1; drawHUD(ctx);
      if (caption && g.state() !== 'title') { ctx.globalAlpha = Math.min(1, caption.life * 2); rr(ctx, 260, 72, 440, 34, 17, 'rgba(58,36,48,.78)'); text(ctx, caption.s, 480, 96, 18, caption.c); ctx.globalAlpha = 1; }
    }
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash / .1})`; ctx.fillRect(-20, -20, g.W + 40, g.H + 40); }
    ctx.restore();
  },
  result() { const max = Math.max(...P.map(p => p.score)), w = P.filter(p => p.score === max).map(p => p.name); return { scores: P.map(p => p.score), text: `5라운드 합계 · ${w.length > 1 ? '공동 승자' : '승자'} ${w.join('·')}` }; } });

function drawP(ctx, p) { // 포즈 (§1 표): 돌기 run(beep 동기) · 돌진 fly · 획득 eat · 플라잉 fly→hit→dizzy(별 3개) · 피콘 dizzy+그을림 · 휴식 sleep · B페이크 jump · 결과 1위 fly/꼴찌 sleep
  const sc = 1.15 * (1 + (p.y - CY) / RY * .1), tp = trackPos(p.i), over = ph.n === 'over' || g.state() === 'end';
  let pose = 'idle', flip = p.x > CX, dy = 0;
  if (p.st === 'run') { if (ph.n === 'circle') { pose = 'run'; flip = Math.sin(tp.a) > 0; } }
  else if (p.st === 'dash' || (p.st === 'stun' && p.t < .25)) pose = 'fly';
  else if (p.st === 'eat') pose = 'eat';
  else if (p.st === 'stun') pose = p.t < .55 ? 'hit' : 'dizzy';
  else if (p.st === 'rest') pose = 'sleep';
  else if (p.st === 'boom') pose = 'dizzy';
  else if (p.st === 'back') { pose = 'run'; flip = p.x > tp.x; }
  if (p.fakeT > 0 && (p.st === 'run' || p.st === 'idle')) { pose = 'jump'; dy = -16 * Math.sin(Math.PI * p.fakeT / .3); }
  if (over) { const sc2 = P.map(q => q.score), max = Math.max(...sc2), min = Math.min(...sc2); pose = p.score === max ? 'fly' : p.score === min && min < max ? 'sleep' : 'idle'; if (pose === 'fly') dy = -Math.abs(Math.sin(g.time * 5)) * 30; }
  if (pose === 'run') { ctx.fillStyle = 'rgba(120,100,80,.3)'; ctx.beginPath(); ctx.arc(p.x + (flip ? 14 : -14), p.y + 36 * sc, 4 + 3 * Math.abs(Math.sin(now * 12.57)), 0, 7); ctx.fill(); }
  drawFlamingo(ctx, p.x, p.y + dy, sc, pose, pose === 'run' ? now * .628 : g.time + p.i, p.color, { flip });
  if (p.burnt) { ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.arc(p.x, p.y + dy - 6 * sc, 22 * sc, 0, 7); ctx.fill(); }
  if (p.st === 'stun' && p.t >= .55) for (let k = 0; k < 3; k++) { const b = g.time * 6 + k * 2.09; text(ctx, '★', p.x + Math.cos(b) * 20, p.y - 44 * sc + Math.sin(b) * 6, 13, palette.gold); }
  if (p.check && (ph.n === 'resolve' || ph.n === 'open' && ph.t > .4)) text(ctx, '…', p.x + 8, p.y - 50 * sc, 22, palette.ink); // 피콘을 확인하는 COM (§8)
  if (p.human && round === 1 && ph.n === 'open' && p.st === 'run') text(ctx, '지금 A 버튼!', p.x, p.y - 82 * sc, 15, palette.pinkDark);
  drawPlayerTag(ctx, p.x, p.y - 62 * sc + dy, p.i);
}
function drawPlate(ctx) { // 접시 + 내용물: 뚜껑 뒤에서 드러남. 딸기·포도만 팝(0.6→1), 멜론·피콘은 즉시 풀 사이즈 (§11.6). 페이크 때는 안 보임
  ctx.fillStyle = palette.white; ctx.strokeStyle = '#d9d3c8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(LX, LY + 6, 90, 30, 0, 0, 7); ctx.fill(); ctx.stroke();
  if (fruit.gone || !/open|resolve|settle/.test(ph.n)) return;
  const k = fruit.kind, s = k === 'berry' || k === 'grape' ? lerp(.6, 1, fruit.pop) : 1;
  ctx.save(); ctx.translate(LX, LY - 4); ctx.scale(s, s);
  if (k === 'berry') for (let j = 0; j < fruit.n; j++) { const x = (j % 5 - 2) * 26 + (j > 4 ? 13 : 0), y = j > 4 ? 12 : -8; ctx.fillStyle = palette.red; ctx.beginPath(); ctx.arc(x, y, 12, 0, 7); ctx.fill(); ctx.fillStyle = '#3f9a3a'; ctx.beginPath(); ctx.moveTo(x - 7, y - 9); ctx.lineTo(x + 7, y - 9); ctx.lineTo(x, y - 17); ctx.fill(); }
  else if (k === 'grape') { ctx.fillStyle = '#8a4fd6'; [[-27, -18], [-9, -18], [9, -18], [27, -18], [-18, -2], [0, -2], [18, -2], [-9, 14], [9, 14], [0, 28]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 10, 0, 7); ctx.fill(); }); }
  else if (k === 'melon') { ctx.fillStyle = '#3fae4a'; ctx.beginPath(); ctx.arc(0, -8, 42, 0, 7); ctx.fill(); ctx.strokeStyle = '#237a2c'; ctx.lineWidth = 4; for (const r of [4, 20, 34]) { ctx.beginPath(); ctx.ellipse(0, -8, r, 42, 0, 0, 7); ctx.stroke(); } }
  else { ctx.fillStyle = '#7d8fa3'; for (let j = 0; j < 6; j++) { const a = j * Math.PI / 3 + Math.PI / 6; ctx.beginPath(); ctx.moveTo(Math.cos(a - .4) * 26, -8 + Math.sin(a - .4) * 26); ctx.lineTo(Math.cos(a) * 40, -8 + Math.sin(a) * 40); ctx.lineTo(Math.cos(a + .4) * 26, -8 + Math.sin(a + .4) * 26); ctx.fill(); } ctx.beginPath(); ctx.arc(0, -8, 30, 0, 7); ctx.fill(); ctx.fillStyle = palette.ink; [-11, 11].forEach(x => { ctx.beginPath(); ctx.arc(x, -12, 4, 0, 7); ctx.fill(); }); }
  ctx.restore();
}
function drawAipom(ctx) { // 에이팜 = 뚜껑 위에 선 보라 큰 플라밍고. 뚜껑을 들 때 같이 뛰어오르고, 페이크 뒤 0.4s "?" 말풍선
  const y = LY - 8 - 85 * lid; drawFlamingo(ctx, LX, y, 1.2, lid > .05 ? 'jump' : 'idle', g.time, AIPOM);
  if (qT > 0) { ctx.fillStyle = palette.white; ctx.beginPath(); ctx.arc(LX + 36, y - 72, 15, 0, 7); ctx.fill(); text(ctx, '?', LX + 36, y - 65, 20, AIPOM); }
}
function drawLid(ctx) { // 나무 뚜껑: lift에 따라 위로 떠오르며 뒤로 젖혀짐(ry 축소)
  const y = LY - 85 * lid, ry = 46 * (1 - .55 * lid);
  ctx.fillStyle = '#b97a3c'; ctx.strokeStyle = '#7a4a1e'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(LX, y, 110, ry, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(122,74,30,.5)'; ctx.lineWidth = 2; for (const k of [.55, .8]) { ctx.beginPath(); ctx.ellipse(LX, y, 110 * k, ry * k, 0, 0, 7); ctx.stroke(); }
  rr(ctx, LX - 22, y - ry * .35 - 8, 44, 14, 7, '#7a4a1e');
}
function drawHUD(ctx) { // 네 귀퉁이 패널 (§11.10): 색 띠 + 배지 + 점수(콤마) · ★ 선두 · 휴식 오버레이 · 스턴 별 3개. 상단 중앙 라운드 + 음표
  const max = Math.max(...P.map(p => p.score));
  P.forEach((p, i) => { const x = i % 2 ? 744 : 16, y = i < 2 ? 12 : 480;
    rr(ctx, x, y, 200, 48, 10, 'rgba(255,255,255,.88)'); rr(ctx, x, y, 12, 48, 5, p.color); drawPlayerTag(ctx, x + 54, y + 24, i);
    text(ctx, fmt(p.score), x + 190, y + 33, 24, palette.ink, 'right');
    if (p.st === 'rest') { rr(ctx, x, y, 200, 48, 10, 'rgba(90,90,90,.6)'); text(ctx, '휴식', x + 100, y + 32, 20, palette.white); }
    else if (p.st === 'stun') text(ctx, '★★★', x + 92, y + 30, 11, palette.red, 'left');
    else if (max > 0 && p.score === max) text(ctx, '★', x + 94, y + 31, 15, palette.gold, 'left');
  });
  text(ctx, `라운드 ${round} / ${ROUNDS}`, 480, 46, 26, palette.ink);
  if (ph.n === 'circle') text(ctx, '♪', 592, 50, 30, note > 0 ? palette.pinkDark : 'rgba(226,85,140,.35)');
}
